<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Attendance Calculator</title>
  <!-- Load the same web font used by the original website. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <!-- All page styling is kept in this separate stylesheet. -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Decorative fixed background shapes remain behind the main content. -->
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <main>
    <!-- Page title and manually controlled theme toggle. -->
    <header>
      <div>
        <!-- The title is clickable and opens the creator credit card. -->
        <h1 class="app-title" id="appTitle" role="button" tabindex="0" aria-haspopup="dialog">Attendance Calculator</h1>
        <div class="sub">Know exactly where you stand.</div>
      </div>
      <!-- Restore the original half-circle glyph and rotate it slightly for alignment. -->
      <button class="theme" id="theme" aria-label="Toggle theme" type="button">
        <span class="theme-icon" id="themeIcon" aria-hidden="true">◐</span>
      </button>
    </header>

    <!-- Two compact attendance inputs; of remains as visual separator. -->
    <section class="glass input-card">
      <div class="field">
        <input id="att" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="0" maxlength="4" aria-label="Sessions attended" autocomplete="off">
        <label for="att">Sessions attended</label>
      </div>
      <div class="of">of</div>
      <div class="field">
        <input id="tot" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="0" maxlength="4" aria-label="Total sessions" autocomplete="off">
        <label for="tot">Total sessions</label>
      </div>
    </section>

    <!-- Validation message is announced live and appears only for invalid input. -->
    <div class="msg" id="msg" role="status"></div>

    <!-- Live compact percentage card and dynamically generated milestone list. -->
    <section class="result" id="result" aria-live="polite">
      <div class="glass hero">
        <div class="ring">
          <svg viewBox="0 0 108 108">
            <circle class="tr" cx="54" cy="54" r="48"/>
            <circle class="fg" id="fg" cx="54" cy="54" r="48"/>
          </svg>
          <div class="pct"><span><span id="pct">0</span><small>%</small></span></div>
        </div>
        <div class="verdict">
          <div class="big"><span id="bl"></span> <b id="bn">0</b> <span id="bu"></span></div>
          <p id="note"></p>
        </div>
      </div>

      <h2>Your milestones</h2>
      <div class="list" id="list"></div>
      <p class="foot">Skip counts assume you miss classes from today onward. Attend counts assume you attend every upcoming class.</p>
      <button class="reset" id="reset">Clear and start over</button>
    </section>
  </main>

  <!-- Centered creator card; the backdrop closes it when clicked. -->
  <div class="modal-backdrop" id="creatorModal" aria-hidden="true">
    <section class="creator-card glass" role="dialog" aria-modal="true" aria-labelledby="creatorTitle">
      <button class="modal-close" id="modalClose" type="button" aria-label="Close creator card">×</button>
      <h2 class="creator-title" id="creatorTitle">Made with ❤️ by Aryan</h2>
      <a
        class="github-button"
        href="https://github.com/Aryan-9907/Attendance-Calculator"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Open Attendance Calculator on GitHub"
      >
        <!-- Inline GitHub mark keeps the button crisp at every size. -->
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 2C6.477 2 2 6.477 2 12c0 4.419 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.009-.866-.013-1.7-2.782.604-3.369-1.34-3.369-1.34-.454-1.154-1.11-1.462-1.11-1.462-.908-.62.069-.608.069-.608 1.004.07 1.532 1.03 1.532 1.03.892 1.529 2.341 1.087 2.91.831.091-.646.349-1.087.635-1.337-2.221-.253-4.555-1.111-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.563 9.563 0 0 1 12 6.844c.85.004 1.705.115 2.504.337 1.909-1.294 2.748-1.025 2.748-1.025.546 1.377.202 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.338 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.337-.012 2.415-.012 2.743 0 .267.18.579.688.481A10.003 10.003 0 0 0 22 12c0-5.523-4.477-10-10-10Z"/>
        </svg>
      </a>
    </section>
  </div>

  <!-- Themed confirmation card shown before clearing saved attendance values. -->
  <div class="modal-backdrop" id="resetModal" aria-hidden="true">
    <section class="confirmation-card glass" role="dialog" aria-modal="true" aria-labelledby="resetTitle">
      <button class="modal-close" id="resetModalClose" type="button" aria-label="Cancel reset">×</button>
      <h2 class="creator-title" id="resetTitle">Clear attendance data?</h2>
      <p class="confirmation-copy">This will erase both saved values.</p>
      <div class="confirmation-actions">
        <button class="confirmation-button" id="cancelReset" type="button">Cancel</button>
        <button class="confirmation-button confirm-reset" id="confirmReset" type="button">Reset</button>
      </div>
    </section>
  </div>

  <!-- All calculator behavior is kept in this separate script. -->
  <script src="script.js"></script>
</body>
</html>
